name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No untrusted event data (issue/PR titles, branch names, commit messages) is
# interpolated into any `run:` step below -- only `matrix.python-version`,
# which is defined in this file.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Run examples
        run: |
          python examples/example_order_matching.py
          python examples/example_simulated_broker.py
